version: '3.8'
services:
  app:
    # GHCR'dan çekilen hazır imaj. Portainer stack env'inde
    # APP_IMAGE=ghcr.io/<github-kullanici-adi>/nakliyat-diyari:latest olarak ayarlayın.
    # Yerelde değişkensiz çalışınca build alıp 'nakliyat-diyari:latest' olarak etiketler.
    image: ${APP_IMAGE:-nakliyat-diyari:latest}
    build: ./
    ports:
      - "3800:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nakliyat_user}:${DB_PASSWORD:-db_password}@db:5432/${DB_NAME:-nakliyat_diyari}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://www.nakliyatdiyari.com}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=https://www.nakliyatdiyari.com
      - NODE_ENV=production
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      - db
      - migrate
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-nakliyat_diyari}
      - POSTGRES_USER=${DB_USER:-nakliyat_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nakliyat_user} -d ${DB_NAME:-nakliyat_diyari}"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    # App imajının içine gömülü /app/database/init.sql çalışır.
    # (Portainer git stack'lerde ./database gibi kardeş klasör mount'ları boş
    # geldiği için dosya mount'lu eski yöntem çalışmıyordu.)
    image: ${APP_IMAGE:-nakliyat-diyari:latest}
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nakliyat_user}:${DB_PASSWORD:-db_password}@db:5432/${DB_NAME:-nakliyat_diyari}
    entrypoint: ["sh", "-c", "psql \"$DATABASE_URL\" -f /app/database/init.sql"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: