version: '3.8'
services:
  app:
    build: ./
    ports:
      - "3800:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nakliyat_user}:${DB_PASSWORD:-db_password}@db:5432/${DB_NAME:-nakliyat_diyari}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://nakliyatdiyari.com}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=https://nakliyatdiyari.com
      - NODE_ENV=production
    depends_on:
      - db
      - migrate
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-nakliyat_diyari}
      - POSTGRES_USER=${DB_USER:-nakliyat_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nakliyat_user} -d ${DB_NAME:-nakliyat_diyari}"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    image: postgres:15-alpine
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-db_password}
      - DB_USER=${DB_USER:-nakliyat_user}
      - DB_NAME=${DB_NAME:-nakliyat_diyari}
    volumes:
      - ./database:/migrations
    entrypoint: ["sh", "-c", "PGPASSWORD=$DB_PASSWORD psql -h db -U $DB_USER -d $DB_NAME -f /migrations/init.sql"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: